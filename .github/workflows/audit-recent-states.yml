name: Read-only recent job-state audit
on:
  push:
    branches:
      - fix/linkedin-transient-429-health
    paths:
      - "scripts/audit_recent_states.py"
      - ".github/workflows/audit-recent-states.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python scripts/audit_recent_states.py
