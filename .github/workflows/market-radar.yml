name: Arash Indeed + StepStone Job Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
      - improve/regression-safety-and-market-validation
    paths:
      - "market_monitor.py"
      - "job_matcher.py"
      - "profile.py"
      - "supabase_store.py"
      - "scripts/**"
      - ".github/workflows/market-radar.yml"

permissions:
  contents: read

concurrency:
  group: arash-market-job-radar
  cancel-in-progress: true

jobs:
  market-radar:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MARKET_DRY_RUN: "1"
      MARKET_SOURCES: "stepstone"
      MARKET_MAX_DETAILS: "12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run safe StepStone dry-run sample
        run: |
          set -o pipefail
          python market_monitor.py | tee market_scan.log

      - name: Fail when StepStone was blocked or no sample was assessed
        run: python -m scripts.market_health market_scan.log

      - name: Preserve dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stepstone-validation-${{ github.run_id }}
          path: |
            market_scan.log
            market_health.json
            market_audit.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Weekly summary and manual-review digest
        if: ${{ github.event_name == 'schedule' }}
        run: python -m scripts.weekly_report

      - name: Alert if live validation fails
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            curl --fail --silent --show-error --retry 2 \
              --request POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=⚠️ StepStone dry-run validation failed. No production alerts were enabled. ${RUN_URL}"
          else
            echo "::warning::Telegram notification secrets missing"
          fi
