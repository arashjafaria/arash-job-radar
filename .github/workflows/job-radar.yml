name: Arash Job Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: arash-job-radar
  cancel-in-progress: false

jobs:
  check-bmw-jobs:

    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run BMW Job Radar
        run: |
          python bmw_monitor.py

      - name: Save Job Radar memory
        run: |
          if git diff --quiet bmw_seen_jobs.json; then
            echo "No job database changes."
          else
            git config user.name "Arash Job Radar"
            git config user.email "actions@github.com"
            git add bmw_seen_jobs.json
            git commit -m "Update BMW job memory"
            git push
          fi